events {}

http {
    # Map file extensions to MIME types. Without this, nginx serves the
    # noVNC assets as text/plain and browsers refuse to apply the
    # stylesheet, render the SVG icons, or execute the JS modules —
    # leaving a raw unstyled page with broken images.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 5090;
        client_max_body_size 32m;

        # Serve noVNC from the same origin as the dashboard, including when
        # the app is accessed remotely or through an HTTPS reverse proxy.
        location /browser/ {
            alias /usr/share/novnc/;
        }

        # Keep noVNC's standard /websockify endpoint. The static viewer is
        # mounted below /browser/, but the WebSocket stays at the origin root.
        location = /websockify {
            proxy_pass http://127.0.0.1:6080/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:5091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
