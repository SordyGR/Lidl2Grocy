services:
  lidl-parser:
    build: .
    ports:
      - "5090:5090"
      - "127.0.0.1:6080:6080"
    environment:
      DISPLAY: ":99"
      LIDL_BROWSER_LOGIN_ENABLED: "1"
      LIDL_PROFILE_DIR: /app/data/.lidl-profile-docker
    env_file: [.env]
    volumes: ["./data:/app/data", "./receipts:/app/receipts"]
    restart: unless-stopped
