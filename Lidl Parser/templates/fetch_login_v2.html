{% extends "base_v2.html" %}
{% block content %}
<div class="popup">
<div class="card">
<h1>Sign in</h1>
<p id="msg" class="sub"></p>
<form id="login-form" method="post" action="/fetch/login">
  <div class="field"><label>Email</label><input type="text" name="email" value="{{ email }}" autocomplete="username"></div>
  <div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password"></div>
  <div class="field"><label><input type="checkbox" name="save" value="on" checked> Save credentials</label></div>
  <button class="btn" type="submit">Continue</button>
</form>
</div>
<div class="card" style="margin-top:1rem">
<h2>Real Lidl site (never blocked)</h2>
<p><a href="{{ real_login_url }}" target="_blank" rel="noopener">Open lidl-hellas.gr purchase history →</a></p>
<p class="sub">Log in there yourself, then close that tab. Closing it retries sync automatically.</p>
</div>
<div class="card" style="margin-top:1rem">
<h2>No luck? Paste a receipt instead</h2>
<form method="post" action="/fetch/paste">
<div class="field"><textarea name="text" rows="5" placeholder="On lidl-hellas.gr open a receipt, Ctrl+A, Ctrl+C, paste here"></textarea></div>
<input name="tid" placeholder="transaction id (optional)">
<button class="btn">Import pasted receipt</button>
</form>
</div>
</div>
<script>
(function() {
  const form = document.getElementById('login-form');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = 'Signing in…';
    const r = await fetch('/fetch/login', {method: 'POST', body: new FormData(form)});
    let j = {};
    try { j = await r.json(); } catch (_) {}
    if (r.ok && j.ok) {
      msg.textContent = 'Signed in. You can close this window.';
      try { window.opener.postMessage('lidl-login-ok', '*'); } catch (_) {}
      setTimeout(() => window.close(), 800);
    } else {
      msg.textContent = (j && j.error) || 'Sign-in failed. Check email/password and retry.';
    }
  });
})();
</script>
{% endblock %}
